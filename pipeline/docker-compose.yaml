services:
  postgres:
    image: postgres:18
    env_file: ".env"
    ports:
      - 5432:5432
    volumes:
      - "ny_taxi_postgres_data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  
  pgadmin:
    image: dpage/pgadmin4
    env_file: ".env"
    ports:
      - 8885:80
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
  
  pipeline:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ".env"

volumes:
  ny_taxi_postgres_data:
  pgadmin_data: