[project]
name = "pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Serge", email = "billcipher806@gmail.com" }
]
requires-python = ">=3.13.11"
dependencies = [
    "dotenv>=0.9.9",
    "pandas>=3.0.5",
    "psycopg[binary]",
    "pyarrow>=25.0.1",
    "sqlalchemy==2.0.52",
    "tqdm>=4.70.0",
]

[project.scripts]
pipeline = "pipeline:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"


[tool.uv]
package = false

[dependency-groups]
dev = [
    "pgcli>=4.5.0",
]
